<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Real vs. Fake Scientific Claims{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background-color: #f0ede6;
      color: #1a1a18;
      font-family: 'DM Sans', sans-serif;
    }
    h1, h2, h3 {
      font-family: 'Fraunces', serif;
      font-weight: 300;
    }
    .card {
      background: #faf8f3;
      border: 1px solid #ddd8cc !important;
      color: #1a1a18;
    }
    .text-muted { color: #a89880 !important; }
    .btn-outline-secondary {
      color: #4a3f32;
      border-color: #a89880;
      background: transparent;
      border-radius: 999px;
    }
    .btn-outline-secondary:hover {
      background: #e8e3da;
      color: #1a1a18;
      border-color: #6b5f4e;
    }
    .btn-primary {
      background: #1a1a18;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      color: #f0ede6;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-primary:hover { opacity: 0.85; background: #1a1a18; }
    .badge.bg-primary-subtle {
      background: rgba(139,94,60,0.15) !important;
      color: #8b5e3c !important;
      border: 1px solid rgba(139,94,60,0.3);
    }
    .signal-card-teal   { background: #f0f9ff; border-left: 3px solid #0dcaf0 !important; }
    .signal-card-yellow { background: #fffbeb; border-left: 3px solid #fbbf24 !important; }
    .signal-card-red    { background: #fff1f2; border-left: 3px solid #ef4444 !important; }
    .badge-teal   { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.75rem; font-weight: 600; }
    .badge-yellow { background: #fef9c3; color: #854d0e; border: 1px solid #fde68a; border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.75rem; font-weight: 600; }
    .badge-red    { background: #fee2e2; color: #991b1b; border: 1px solid #fecdd3; border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.75rem; font-weight: 600; }
    .post-card-dark { background: #faf8f3; border: 1px solid #ddd8cc; border-radius: 16px; }
    .post-highlight-dark { background: rgba(184,76,30,0.08); border-left: 3px solid #b84c1e; border-radius: 8px; padding: 0.75rem 1rem; }
    .scenario-q-dark { background: rgba(139,94,60,0.06); border: 1px solid rgba(139,94,60,0.2); border-radius: 12px; padding: 1.5rem; text-align: center; }
    .ann-red    { background: #fff1f2; border-left: 3px solid #f87171; border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; }
    .ann-teal   { background: #f0f9ff; border-left: 3px solid #38bdf8; border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; }
    .ann-yellow { background: #fffbeb; border-left: 3px solid #fbbf24; border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; }
    .good-card { background: #f0fdf4; border: 1px solid #bbf7d0 !important; border-radius: 14px; }
    .bad-card  { background: #fff1f2; border: 1px solid #fecdd3 !important; border-radius: 14px; }
    .good-header { background: rgba(34,197,94,0.08); border-bottom: 1px solid #bbf7d0; padding: 1rem 1.25rem; border-radius: 14px 14px 0 0; }
    .bad-header  { background: rgba(239,68,68,0.08); border-bottom: 1px solid #fecdd3; padding: 1rem 1.25rem; border-radius: 14px 14px 0 0; }
    blockquote { border-left: 3px solid #ddd8cc !important; color: #6b5f4e !important; }
    .footnote-bar { background: #faf8f3; border: 1px solid #ddd8cc; border-radius: 10px; padding: 1rem; text-align: center; }
  </style>
</head>
<body>
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("/api/track", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "page_enter", path: window.location.pathname }),
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
